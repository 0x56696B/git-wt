[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-wt"
version = "1.0.4"
description = "A git-worktree extension to make using worktrees a pain of the past"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pygit2==1.19.2",
    "rich==14.3.3",
    "result==0.17.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.8",
]

[project.scripts]
git-wt = "src.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter with line-length above)
]

[tool.ruff.format]
quote-style = "double"
