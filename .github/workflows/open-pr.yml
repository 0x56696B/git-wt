name: Open draft PR

on:
  push:
    branches: [feat/github-release-pipeline]

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Create draft PR (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --head feat/github-release-pipeline \
            --base main \
            --json number \
            --jq '.[0].number' 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists — nothing to do"
            exit 0
          fi

          gh pr create \
            --draft \
            --base main \
            --head feat/github-release-pipeline \
            --title "ci: add GitHub Actions release pipeline" \
            --body "## What

Adds \`.github/workflows/release.yml\` — a pipeline that fires on every push to \`main\` and:

1. **Detects semver bump type** from the merge commit message (conventional commits)
   - \`BREAKING CHANGE\` / \`!:\` → **major**
   - \`feat:\` → **minor**
   - anything else → **patch**
2. **Updates version** in \`pyproject.toml\` and \`src/main.py\`
3. **Builds** wheel + sdist via \`hatch build\`
4. **Commits + tags** the bump (\`chore: bump version X → Y\`) and pushes with \`--follow-tags\`
5. **Creates a GitHub Release** with auto-generated notes and the \`dist/*\` artefacts attached

### Loop prevention

The job has an \`if:\` guard that skips when the triggering commit starts with \`chore: bump version\`, so the version-bump push does not re-trigger itself."
